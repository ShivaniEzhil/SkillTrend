name: Daily Tech Job ETL

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write         # Required to push changes back to the repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Data Directories
      run: |
        mkdir -p data/raw
        mkdir -p data/processed

    - name: Run Extraction (Adzuna)
      env:
        ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
        ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      run: python src/extraction/adzuna_extractor.py

    - name: Run ETL Processor
      run: |
        cd src/processing
        python processor.py
        cd ../..

    - name: Cleanup Old Raw Data (Keep last 7 days)
      run: |
        find data/raw -name "*.json" -type f -mtime +7 -delete || echo "No old files to delete"

    - name: Commit and Push Data Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Force add ensuring summary data is always tracked
        git add -f data/raw/ data/processed/processed_jobs.csv || true

        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "Automated daily update (7-day retention): $(date +'%Y-%m-%d')"
          git push
        else
          echo "No changes to commit."
        fi



